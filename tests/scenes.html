<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peek-a-Keep · Weather scene review</title><link rel="stylesheet" href="../styles.css"><style>.review-controls{position:absolute;z-index:8;bottom:20px;left:18px;right:18px;display:flex;gap:7px}.review-controls button{flex:1;font-size:11px;padding:12px 4px;border-radius:10px;background:#ffe5a1;color:#28493d}.review-note{position:absolute;top:140px;left:24px;right:24px;font-size:10px;color:#ffefc9;z-index:5}</style></head>
<body><main id="game"><div id="scene"></div><div class="vignette"></div><header class="hud"><span class="eyebrow">EXPANSION SCENE REVIEW · NO SAVE CHANGES</span><div class="level-info"><strong id="region">Royal courtyard</strong></div><div class="boss-status"><div><span>MOVING FORTRESS · WEAK POINT OPEN</span><span>28 / 40</span></div><div class="boss-track"><div style="height:100%;width:70%;background:#e49c5a"></div></div></div></header><div class="review-note">Static review of the real meshes: repair wagon, fortress, mortar, ram, shell arc and landing ring.</div><div class="review-controls"><button data-terrain="river">River crossing</button><button data-terrain="mountain">Mountain pass</button><button data-terrain="courtyard">Royal courtyard</button><button data-weather="rain">Rain</button><button data-weather="fog">Fog</button><button data-weather="dusk">Dusk</button></div></main>
<script type="module">
import {GameScene} from '../src/scene.js';import {GameModel,getLevelConfig} from '../src/model.js';import {ROUTES} from '../src/content.js';
const model=new GameModel(13,7,'archers',{config:{...getLevelConfig(13),formation:['support','boss','mortar','ram'],total:4},cosmetic:'emerald'});
for(let i=0;i<4;i++)model.spawnEnemy();
model.state.enemies.forEach((e,i)=>{e.progress=[.08,.36,.62,.84][i];e.lane=[-1,1,-1,1][i];});
const boss=model.state.enemies[1];boss.hp=28;boss.bossPhase='reload';model.state.enemies[2].warning=.8;
model.state.projectiles=[{id:100,type:'mortar',lane:-1,from:.62,progress:.52,elapsed:1.066,duration:2.05}];
const scene=new GameScene(document.getElementById('scene'));let last=0;
document.querySelectorAll('[data-terrain]').forEach(b=>b.addEventListener('click',()=>{model.state.terrain=b.dataset.terrain;document.getElementById('region').textContent=ROUTES[b.dataset.terrain].name;}));
document.querySelectorAll('[data-weather]').forEach(b=>b.addEventListener('click',()=>{model.state.environment=b.dataset.weather;model.state.terrain=b.dataset.weather==='fog'?'mountain':b.dataset.weather==='rain'?'river':'courtyard';document.getElementById('region').textContent=b.textContent+' · '+ROUTES[model.state.terrain].name;}));
function frame(now){scene.render(model.state,Math.min((now-last)/1000||0,.05));last=now;document.getElementById('game').dataset.rainHeight=scene.rain.geometry.attributes.position.array[1].toFixed(3);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
